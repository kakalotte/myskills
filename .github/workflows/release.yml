name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.platform }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            osName: linux
          - platform: ubuntu-24.04-arm
            osName: linux
          - platform: macos-latest
            osName: macos
          - platform: windows-latest
            osName: windows

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/set-version.mjs ${{ github.ref_name }}

      - name: Build and publish bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tagName: ${{ github.ref_name }}
          releaseName: 'mySkills ${{ github.ref_name }}'
          releaseBody: |
            ## ??

            ??????????????:

            - **macOS (Apple Silicon)**: `mySkills-macos-aarch64-*.dmg`
            - **Windows**: `mySkills-windows-x64-*-setup.exe`(NSIS ???)
            - **Linux x86_64 (?? PC)**: `mySkills-linux-amd64-*.AppImage` ? `.deb`
            - **Linux ARM64 (????)**: `mySkills-linux-arm64-*.deb`

            ## macOS ????

            ??????? Apple ????????,??????? macOS ??????
            ?? dmg ?? mySkills.app ????????,?????????:

                xattr -cr "/Applications/mySkills.app"

            ???????????
          assetNamePattern: '[name]-${{ matrix.osName }}-[arch]-[version][setup][ext]'
          releaseDraft: true
          prerelease: false
