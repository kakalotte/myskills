name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.platform }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            osName: linux
          - platform: ubuntu-24.04-arm
            osName: linux
          - platform: macos-latest
            osName: macos
          - platform: macos-15-intel
            osName: macos
          - platform: windows-latest
            osName: windows
          - platform: windows-11-arm
            osName: windows

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/set-version.mjs ${{ github.ref_name }}

      - name: Build and publish bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tagName: ${{ github.ref_name }}
          releaseName: 'mySkills ${{ github.ref_name }}'
          releaseBody: |
            ## 下载

            请选择与你的系统对应的安装包：

            - **macOS (Apple Silicon)**: `mySkills-macos-aarch64-*.dmg`
            - **macOS (Intel)**: `mySkills-macos-x64-*.dmg`
            - **Windows (x64)**: `mySkills-windows-x64-*-setup.exe`（NSIS 安装包）
            - **Windows (ARM64)**: `mySkills-windows-arm64-*-setup.exe`（NSIS 安装包）
            - **Linux (.deb, x64)**: `mySkills-linux-amd64-*.deb`
            - **Linux (.deb, ARM64)**: `mySkills-linux-arm64-*.deb`
            - **Linux (.rpm, x64)**: `mySkills-linux-x86_64-*.rpm`
            - **Linux (.rpm, ARM64)**: `mySkills-linux-aarch64-*.rpm`
            - **Linux (AppImage, x64)**: `mySkills-linux-amd64-*.AppImage`
            - **Linux (AppImage, ARM64)**: `mySkills-linux-aarch64-*.AppImage`

            ## macOS 安装说明

            当前版本未进行 Apple 开发者签名与公证，从浏览器下载后 macOS 会阻止打开。
            请将 dmg 中的 mySkills.app 拖入「应用程序」，然后在「终端」执行：

                xattr -cr "/Applications/mySkills.app"

            之后即可正常双击打开。
          assetNamePattern: '[name]-${{ matrix.osName }}-[arch]-[version][setup][ext]'
          releaseDraft: true
          prerelease: false
